# 매일 아침(한국 시간 8시) 공개 사이트를 휴대폰·PC 크기로 열어 점검 → 문제가 있으면 이슈로 알림
name: daily-site-check
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: 점검
        id: run
        run: node tools/check/daily.js
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-report
          path: report/
      - name: 문제가 있으면 이슈 열기
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "사이트 점검 실패 $(date +%F)" --body-file report/report.md --label "site-check" || gh issue create --title "사이트 점검 실패 $(date +%F)" --body-file report/report.md
