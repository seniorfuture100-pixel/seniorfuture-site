<style>
.sf-scope .sf-help{max-width:1200px;margin:0 auto;padding:64px 0 24px;font-family:var(--sf-font);color:var(--sf-text)}
.sf-scope .sf-help h1{margin:0 0 24px;font-size:34px;font-weight:700;letter-spacing:-.8px}
.sf-scope .sf-help h2{margin:0 0 16px;font-size:24px;font-weight:700;letter-spacing:-.5px}
.sf-scope .sf-help-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px}
.sf-scope .sf-help-card{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--sf-border);color:inherit;text-decoration:none;transition:box-shadow .2s var(--sf-ease),transform .2s var(--sf-ease)}
.sf-scope .sf-help-card:hover{box-shadow:inset 0 0 0 1px var(--sf-text-3),0 6px 16px rgba(0,0,0,.06);transform:translateY(-2px)}
.sf-scope .sf-help-card svg{flex:none;width:24px;height:24px;fill:none;stroke:var(--sf-text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sf-scope .sf-help-card span{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.sf-scope .sf-help-card b{font-size:17px;font-weight:700}
.sf-scope .sf-help-card small{color:var(--sf-text-3);font-size:14px}
.sf-scope .sf-help-card i{flex:none;width:8px;height:8px;border-top:1.5px solid var(--sf-text-3);border-right:1.5px solid var(--sf-text-3);transform:rotate(45deg)}
.sf-scope .sf-help-tabs{display:flex;gap:28px;margin-bottom:24px;border-bottom:1px solid var(--sf-border)}
.sf-scope .sf-help-tabs a{padding:12px 2px;border-bottom:2px solid transparent;color:var(--sf-text-3);font-size:17px;font-weight:500;text-decoration:none}
.sf-scope .sf-help-tabs a.is-active{border-color:var(--sf-text);color:var(--sf-text);font-weight:700}
.sf-scope .sf-help .sf-chips{margin-bottom:8px}
.sf-scope .sf-help-faq__wait{margin:0;padding:40px 0;border-top:2px solid var(--sf-text);color:var(--sf-text-3);font-size:15px;text-align:center}
.sf-scope .sf-help-more{display:flex;align-items:center;justify-content:center;gap:16px;margin:24px 0 64px;padding:28px;border-radius:16px;background:var(--sf-surface)}
.sf-scope .sf-help-more b{font-size:18px}
.sf-scope .sf-help-more a{display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:999px;background:var(--sf-dark);color:#fff !important;font-size:15px;font-weight:700;text-decoration:none}
.sf-scope .sf-help-more a:hover{background:#000}
.sf-scope .sf-help-refundlink{margin:-48px 0 56px;color:var(--sf-text-3);font-size:14px;text-align:center}
.sf-scope .sf-help-refundlink a{color:var(--sf-text-2);text-decoration:underline}
@media (max-width:767px){
.sf-scope .sf-help{padding:24px 16px 8px !important}
.sf-scope .sf-help h1{margin-bottom:16px;font-size:26px}
.sf-scope .sf-help h2{font-size:20px}
.sf-scope .sf-help-cards{grid-template-columns:1fr;gap:12px;margin-bottom:32px}
.sf-scope .sf-help-card{padding:18px 16px}
.sf-scope .sf-help-card.is-biz,.sf-scope .sf-help-tabs{display:none}
.sf-scope .sf-help-more{flex-direction:column;align-items:stretch;margin:24px 0 48px;padding:0;background:none}
.sf-scope .sf-help-more b{display:none}
.sf-scope .sf-help-more a{justify-content:center;height:52px;border-radius:999px;font-size:16px}
.sf-scope .sf-help-refundlink{margin:-32px 0 40px}
}
</style>
